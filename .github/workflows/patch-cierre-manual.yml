name: Parche cierre manual

on:
  push:
    paths:
      - '.github/workflows/patch-cierre-manual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sustituir cierre manual antiguo
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          patron = re.compile(
              r"async function cerrarQuincena\(\)\{.*?\n\}\n\n// AUTO-DETECTAR MES ACTUAL",
              re.S,
          )

          nuevo = r'''async function cerrarQuincena(){
  // El cierre manual antiguo generaba IDs nuevos en el navegador y podía
  // producir copias o inconsistencias. Queda deshabilitado: el único cierre
  // válido es el cierre automático del servidor (/api/cerrar-quincena),
  // ejecutado los días 1 y 16 por la automatización.
  alert('El cierre manual está deshabilitado por seguridad. La quincena se cierra automáticamente los días 1 y 16.');
  return;
}

// AUTO-DETECTAR MES ACTUAL'''

          s2, n = patron.subn(nuevo, s, count=1)
          if n != 1:
              raise SystemExit(f'No se pudo localizar exactamente la función cerrarQuincena (coincidencias: {n})')

          p.write_text(s2, encoding='utf-8')

      - name: Verificar que no quedan IDs aleatorios en cerrarQuincena
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'async function cerrarQuincena\(\)\{(.*?)\n\}',s,re.S)
          if not m:
              raise SystemExit('No se encontró cerrarQuincena')
          if 'Date.now()+Math.random()' in m.group(1):
              raise SystemExit('Sigue presente la lógica antigua de IDs aleatorios')
          print('OK: cierre manual antiguo retirado')
          PY

      - name: Commit del parche y retirada del workflow temporal
        shell: bash
        run: |
          rm -f .github/workflows/patch-cierre-manual.yml
          git config user.name 'urpi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/patch-cierre-manual.yml
          git commit -m 'Deshabilitar cierre manual antiguo y dejar cierre unico de servidor'
          git push
