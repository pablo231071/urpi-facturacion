name: Parche cierre manual v2

on:
  push:
    paths:
      - '.github/workflows/patch-cierre-manual-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patron = re.compile(r"async function cerrarQuincena\(\)\{.*?\n\}\n\n// AUTO-DETECTAR MES ACTUAL", re.S)
          nuevo = """async function cerrarQuincena(){
  alert('El cierre manual está deshabilitado por seguridad. La quincena se cierra automáticamente los días 1 y 16.');
  return;
}

// AUTO-DETECTAR MES ACTUAL"""
          s2, n = patron.subn(nuevo, s, count=1)
          if n != 1:
              raise SystemExit(f'No se pudo localizar exactamente cerrarQuincena; coincidencias={n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r"async function cerrarQuincena\(\)\{(.*?)\n\}", s, re.S)
          if not m:
              raise SystemExit('No se encontró cerrarQuincena')
          if 'Date.now()+Math.random()' in m.group(1):
              raise SystemExit('Sigue presente la lógica antigua')
          if 'deshabilitado por seguridad' not in m.group(1):
              raise SystemExit('No se aplicó el mensaje de seguridad')
          print('Parche verificado')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'urpi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Deshabilitar cierre manual antiguo'
          git push
